apiVersion: mcp/v1beta1
kind: MCPServer
metadata:
  namespace: agentic-plugins
  name: podman
  title: Podman MCP Server
  description: >
    Podman MCP server for container management operations.
    Provides container lifecycle management, image operations,
    and local container runtime interaction.
  labels:
    distribution: external
  annotations:
    backstage.io/source-location: >-
      url:https://github.com/RHEcosystemAppEng/agentic-plugins/blob/main/rh-developer/mcps.json
  tags:
    - podman
    - containers
    - developer
    - mcp-server
  links:
    - url: https://github.com/manusa/podman-mcp-server
      title: Upstream Repository
      icon: github
spec:
  type: local
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  primitives:
    - type: tool
      name: container_inspect
      description: Display low-level information and configuration of a container.
    - type: tool
      name: container_list
      description: List running containers with status information.
    - type: tool
      name: container_logs
      description: Display logs of a container by ID or name.
    - type: tool
      name: container_remove
      description: Remove a container by ID or name.
    - type: tool
      name: container_run
      description: Run a container with a specified image.
    - type: tool
      name: container_stop
      description: Stop a running container by ID or name.
    - type: tool
      name: image_build
      description: Build an image from a Dockerfile, Podmanfile, or Containerfile.
    - type: tool
      name: image_list
      description: List container images on the local machine.
    - type: tool
      name: image_pull
      description: Pull a container image from a registry to local storage.
    - type: tool
      name: image_push
      description: Push a container image from local storage to a registry.
    - type: tool
      name: image_remove
      description: Remove a container image from local storage.
    - type: tool
      name: network_list
      description: List all available container networks.
    - type: tool
      name: volume_list
      description: List all available container volumes.
  packages:
    - type: npx
      name: podman-mcp-server
      version: 0.0.15
      environment_variables: []
  remotes: []
  dependsOn:
    - system:default/agentic-plugins
  dependencyOf:
    - airesource:rh-developer/containerize-deploy
    - airesource:rh-developer/debug-build
    - airesource:rh-developer/debug-container
    - airesource:rh-developer/debug-network
    - airesource:rh-developer/debug-pipeline
    - airesource:rh-developer/debug-pod
    - airesource:rh-developer/debug-rbac
    - airesource:rh-developer/debug-rhel
    - airesource:rh-developer/debug-scc
    - airesource:rh-developer/deploy
    - airesource:rh-developer/detect-project
    - airesource:rh-developer/helm-deploy
    - airesource:rh-developer/incident-triage
    - airesource:rh-developer/recommend-image
    - airesource:rh-developer/rh-developer
    - airesource:rh-developer/rhel-deploy
    - airesource:rh-developer/s2i-build
    - airesource:rh-developer/validate-environment
