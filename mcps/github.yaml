apiVersion: mcp/v1beta1
kind: MCPServer
metadata:
  namespace: agentic-plugins
  name: github
  title: GitHub MCP Server
  description: >
    GitHub MCP server for repository operations, pull request management,
    issue tracking, and code search across GitHub repositories.
  labels:
    distribution: external
  annotations:
    backstage.io/source-location: >-
      url:https://github.com/RHEcosystemAppEng/agentic-plugins/blob/main/rh-developer/mcps.json
  tags:
    - github
    - developer
    - source-control
    - mcp-server
  links:
    - url: https://github.com/github/github-mcp-server
      title: Upstream Repository
      icon: github
spec:
  type: local
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  primitives:
    - type: tool
      name: actions_get
      description: Get details of GitHub Actions resources (workflows, runs, jobs, artifacts).
    - type: tool
      name: actions_list
      description: List GitHub Actions workflows in a repository.
    - type: tool
      name: actions_run_trigger
      description: Trigger GitHub Actions workflow actions.
    - type: tool
      name: get_job_logs
      description: Get GitHub Actions workflow job logs.
    - type: tool
      name: get_code_scanning_alert
      description: Get a code scanning alert.
    - type: tool
      name: list_code_scanning_alerts
      description: List code scanning alerts.
    - type: tool
      name: get_me
      description: Get my user profile.
    - type: tool
      name: get_team_members
      description: Get team members.
    - type: tool
      name: get_teams
      description: Get teams.
    - type: tool
      name: assign_copilot_to_issue
      description: Assign Copilot to an issue.
    - type: tool
      name: request_copilot_review
      description: Request Copilot review on a pull request.
    - type: tool
      name: get_dependabot_alert
      description: Get a Dependabot alert.
    - type: tool
      name: list_dependabot_alerts
      description: List Dependabot alerts.
    - type: tool
      name: get_discussion
      description: Get a discussion.
    - type: tool
      name: get_discussion_comments
      description: Get discussion comments.
    - type: tool
      name: list_discussion_categories
      description: List discussion categories.
    - type: tool
      name: list_discussions
      description: List discussions.
    - type: tool
      name: create_gist
      description: Create a Gist.
    - type: tool
      name: get_gist
      description: Get Gist content.
    - type: tool
      name: list_gists
      description: List Gists.
    - type: tool
      name: update_gist
      description: Update a Gist.
    - type: tool
      name: get_repository_tree
      description: Get repository tree.
    - type: tool
      name: add_issue_comment
      description: Add comment to an issue.
    - type: tool
      name: get_label
      description: Get a specific label from a repository.
    - type: tool
      name: issue_read
      description: Get issue details.
    - type: tool
      name: issue_write
      description: Create or update an issue.
    - type: tool
      name: list_issue_types
      description: List available issue types.
    - type: tool
      name: list_issues
      description: List issues.
    - type: tool
      name: search_issues
      description: Search issues.
    - type: tool
      name: sub_issue_write
      description: Change sub-issue.
    - type: tool
      name: label_write
      description: Write operations on repository labels.
    - type: tool
      name: list_label
      description: List labels from a repository.
    - type: tool
      name: dismiss_notification
      description: Dismiss a notification.
    - type: tool
      name: get_notification_details
      description: Get notification details.
    - type: tool
      name: list_notifications
      description: List notifications.
    - type: tool
      name: manage_notification_subscription
      description: Manage notification subscription.
    - type: tool
      name: manage_repository_notification_subscription
      description: Manage repository notification subscription.
    - type: tool
      name: mark_all_notifications_read
      description: Mark all notifications as read.
    - type: tool
      name: search_orgs
      description: Search organizations.
    - type: tool
      name: projects_get
      description: Get details of GitHub Projects resources.
    - type: tool
      name: projects_list
      description: List GitHub Projects resources.
    - type: tool
      name: projects_write
      description: Modify GitHub Project items.
    - type: tool
      name: add_comment_to_pending_review
      description: Add review comment to the latest pending pull request review.
    - type: tool
      name: add_reply_to_pull_request_comment
      description: Add reply to pull request comment.
    - type: tool
      name: create_pull_request
      description: Open a new pull request.
    - type: tool
      name: list_pull_requests
      description: List pull requests.
    - type: tool
      name: merge_pull_request
      description: Merge a pull request.
    - type: tool
      name: pull_request_read
      description: Get details for a single pull request.
    - type: tool
      name: pull_request_review_write
      description: Write operations on pull request reviews (create, submit, delete).
    - type: tool
      name: search_pull_requests
      description: Search pull requests.
    - type: tool
      name: update_pull_request
      description: Edit a pull request.
    - type: tool
      name: update_pull_request_branch
      description: Update pull request branch.
    - type: tool
      name: create_branch
      description: Create a branch.
    - type: tool
      name: create_or_update_file
      description: Create or update a file.
    - type: tool
      name: create_repository
      description: Create a repository.
    - type: tool
      name: delete_file
      description: Delete a file.
    - type: tool
      name: fork_repository
      description: Fork a repository.
    - type: tool
      name: get_commit
      description: Get commit details.
    - type: tool
      name: get_file_contents
      description: Get file or directory contents.
    - type: tool
      name: get_latest_release
      description: Get latest release.
    - type: tool
      name: get_release_by_tag
      description: Get a release by tag name.
    - type: tool
      name: get_tag
      description: Get tag details.
    - type: tool
      name: list_branches
      description: List branches.
    - type: tool
      name: list_commits
      description: List commits.
    - type: tool
      name: list_releases
      description: List releases.
    - type: tool
      name: list_tags
      description: List tags.
    - type: tool
      name: push_files
      description: Push files to a repository.
    - type: tool
      name: search_code
      description: Search code.
    - type: tool
      name: search_repositories
      description: Search repositories.
    - type: tool
      name: get_secret_scanning_alert
      description: Get a secret scanning alert.
    - type: tool
      name: list_secret_scanning_alerts
      description: List secret scanning alerts.
    - type: tool
      name: get_global_security_advisory
      description: Get a global security advisory.
    - type: tool
      name: list_global_security_advisories
      description: List global security advisories.
    - type: tool
      name: list_org_repository_security_advisories
      description: List organization repository security advisories.
    - type: tool
      name: list_repository_security_advisories
      description: List repository security advisories.
    - type: tool
      name: list_starred_repositories
      description: List starred repositories.
    - type: tool
      name: star_repository
      description: Star a repository.
    - type: tool
      name: unstar_repository
      description: Unstar a repository.
    - type: tool
      name: search_users
      description: Search users.
  packages:
    - type: container
      registry_name: ghcr.io
      name: github/github-mcp-server
      version: "1.0.3"
      environment_variables:
        - description: GitHub personal access token
          name: GITHUB_PERSONAL_ACCESS_TOKEN
  remotes: []
  dependsOn:
    - system:default/agentic-plugins
  dependencyOf:
    - airesource:rh-developer/containerize-deploy
    - airesource:rh-developer/debug-build
    - airesource:rh-developer/debug-container
    - airesource:rh-developer/debug-network
    - airesource:rh-developer/debug-pipeline
    - airesource:rh-developer/debug-pod
    - airesource:rh-developer/debug-rbac
    - airesource:rh-developer/debug-rhel
    - airesource:rh-developer/debug-scc
    - airesource:rh-developer/deploy
    - airesource:rh-developer/detect-project
    - airesource:rh-developer/helm-deploy
    - airesource:rh-developer/incident-triage
    - airesource:rh-developer/recommend-image
    - airesource:rh-developer/rh-developer
    - airesource:rh-developer/rhel-deploy
    - airesource:rh-developer/s2i-build
    - airesource:rh-developer/validate-environment
