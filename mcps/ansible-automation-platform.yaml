apiVersion: mcp/v1beta1
kind: MCPServer
metadata:
  namespace: agentic-plugins
  name: ansible-automation-platform
  title: Ansible Automation Platform MCP Server
  description: >
    Ansible Automation Platform MCP server providing job management,
    inventory management, configuration, security compliance, system
    monitoring, and user management operations via remote HTTP endpoints.
  labels:
    distribution: external
  annotations:
    backstage.io/source-location: >-
      url:https://github.com/RHEcosystemAppEng/agentic-plugins/blob/main/rh-sre/mcps.json
  tags:
    - ansible
    - aap
    - automation
    - mcp-server
  links:
    - url: https://github.com/ansible/aap-mcp-server
      title: Upstream Repository
      icon: github
spec:
  type: remote
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  primitives:
    - type: tool
      name: controller.job_templates_launch_retrieve
      description: Retrieve single launch for a job template.
    - type: tool
      name: controller.job_templates_launch_create
      description: Launch the job template.
    - type: tool
      name: controller.workflow_job_templates_launch_create
      description: Launch the workflow job template.
    - type: tool
      name: controller.jobs_retrieve
      description: Retrieve a job.
    - type: tool
      name: controller.workflow_jobs_retrieve
      description: Retrieve a workflow job.
    - type: tool
      name: controller.jobs_stdout_retrieve
      description: Get the standard output for the selected job.
    - type: tool
      name: controller.jobs_job_events_list
      description: List job events of a job.
    - type: tool
      name: controller.jobs_cancel_create
      description: Cancel a running or pending job.
    - type: tool
      name: controller.workflow_jobs_cancel_create
      description: Cancel a running or pending workflow job.
    - type: tool
      name: controller.jobs_relaunch_retrieve
      description: Retrieve single relaunch for a job.
    - type: tool
      name: controller.jobs_relaunch_create
      description: Relaunch a job.
    - type: tool
      name: controller.workflow_jobs_relaunch_create
      description: Relaunch a workflow job.
    - type: tool
      name: controller.jobs_list
      description: A list of jobs.
    - type: tool
      name: eda.activation_instances_list
      description: List activation instances with status, queue, and timing info.
    - type: tool
      name: eda.activation_instances_logs_list
      description: List logs for an activation instance by ID.
    - type: tool
      name: controller.analytics_retrieve
      description: A list of additional API endpoints related to analytics.
    - type: tool
      name: controller.metrics_retrieve
      description: Get Prometheus metrics data.
    - type: tool
      name: controller.projects_list
      description: A list of projects.
    - type: tool
      name: controller.job_templates_list
      description: A list of job templates.
    - type: tool
      name: controller.workflow_job_templates_list
      description: A list of workflow job templates.
    - type: tool
      name: controller.job_templates_retrieve
      description: Retrieve a job template.
    - type: tool
      name: controller.workflow_job_templates_retrieve
      description: Retrieve a workflow job template.
    - type: tool
      name: controller.jobs_job_host_summaries_list
      description: List job host summaries of a job.
    - type: tool
      name: controller.workflow_jobs_list
      description: A list of workflow jobs.
    - type: tool
      name: controller.workflow_jobs_workflow_nodes_list
      description: List workflow nodes of a workflow job.
    - type: tool
      name: controller.job_templates_create
      description: Create a job template.
    - type: tool
      name: controller.schedules_create
      description: Create a schedule.
    - type: tool
      name: controller.projects_create
      description: Create a project.
    - type: tool
      name: controller.job_templates_credentials_create
      description: Create a credential of a job template.
    - type: tool
      name: controller.job_templates_credentials_list
      description: List credentials of a job template.
    - type: tool
      name: controller.job_templates_survey_spec_create
      description: Update job template survey specification.
    - type: tool
      name: controller.job_templates_notification_templates_started_create
      description: Create notification templates triggered on job start.
    - type: tool
      name: controller.job_templates_notification_templates_success_create
      description: Create notification templates triggered on job success.
    - type: tool
      name: controller.job_templates_notification_templates_error_create
      description: Create notification templates triggered on job error.
    - type: tool
      name: controller.unified_job_templates_list
