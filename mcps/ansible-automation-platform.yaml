      name: gateway.organizations_create
      description: Create an organization.
    - type: tool
      name: gateway.organizations_update
      description: Update an organization.
    - type: tool
      name: gateway.organizations_destroy
      description: Delete an organization.
    - type: tool
      name: gateway.users_list
      description: List platform users.
    - type: tool
      name: gateway.users_retrieve
      description: Retrieve a platform user.
    - type: tool
      name: gateway.users_create
      description: Create a platform user.
    - type: tool
      name: gateway.users_update
      description: Update a platform user.
