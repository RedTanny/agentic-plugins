      description: Create an ad hoc command.
    - type: tool
      name: controller.ad_hoc_commands_list
      description: List ad hoc commands.
    - type: tool
      name: controller.ad_hoc_commands_retrieve
      description: Retrieve an ad hoc command.
    - type: tool
      name: controller.ad_hoc_commands_stdout_retrieve
      description: Retrieve stdout output of an ad hoc command.
    - type: tool
      name: controller.ad_hoc_commands_events_list
      description: List events of an ad hoc command.
    - type: tool
      name: controller.ad_hoc_commands_cancel_create
      description: Cancel an ad hoc command.
    - type: tool
      name: controller.ad_hoc_commands_relaunch_create
      description: Relaunch an ad hoc command.
    - type: tool
      name: controller.ad_hoc_commands_relaunch_retrieve
      description: Return passwords needed to start an ad hoc command.
    - type: tool
      name: controller.hosts_ad_hoc_commands_create
      description: Create an ad hoc command of a host.
    - type: tool
      name: controller.inventories_ad_hoc_commands_create
      description: Create an ad hoc command for an inventory.
    - type: tool
      name: controller.groups_ad_hoc_commands_create
      description: Create an ad hoc command for a group.
    - type: tool
      name: controller.inventories_list
      description: A list of inventories.
    - type: tool
      name: controller.inventory_sources_update_create
      description: Sync the inventory source.
    - type: tool
      name: controller.hosts_list
      description: A list of hosts.
    - type: tool
      name: controller.hosts_retrieve
      description: Retrieve a host.
    - type: tool
      name: controller.hosts_variable_data_retrieve
      description: The extra variable configuration for this host.
    - type: tool
      name: controller.groups_list
      description: A list of groups.
    - type: tool
      name: controller.groups_create
      description: Create a new group.
    - type: tool
      name: controller.inventories_create
      description: Create an inventory.
    - type: tool
      name: controller.hosts_create
      description: Create a host.
    - type: tool
      name: controller.inventory_sources_create
      description: Create an inventory source.
    - type: tool
      name: controller.hosts_ansible_facts_retrieve
      description: Get Ansible facts for a host.
    - type: tool
      name: controller.inventory_sources_list
      description: List inventory sources.
    - type: tool
      name: controller.inventories_inventory_sources_list
      description: List inventory sources for an inventory.
    - type: tool
      name: controller.instance_groups_list
      description: A list of instance groups.
    - type: tool
      name: controller.instance_groups_create
      description: Create an instance group for job execution.
    - type: tool
      name: controller.instance_groups_retrieve
