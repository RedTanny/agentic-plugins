  namespace: ai5-marketplace
  title: Playbook Executor
  description: >
    Execute remediation playbooks via AAP with job management, dry-run support, and
    reporting. Handles Git flow (commit, push, sync) when template playbook paths differ
    from generated playbooks. Use after playbook-generator.
  labels:
    distribution: external
  annotations:
    backstage.io/source-location: >-
      url:https://github.com/RHEcosystemAppEng/agentic-plugins/blob/main/rh-sre/skills/playbook-executor/SKILL.md
  tags:
    - ai-skill
    - sre
    - ansible
    - automation
    - execution
  links:
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins
      title: Source Repository
      icon: github
spec:
  type: skill
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  disciplines:
    - automation
  categories:
    - remediation
  agents: []
  dependsOn:
    - airesource:ai5-marketplace/rh-sre
    - airesource:ai5-marketplace/mcp-aap-validator
    - airesource:ai5-marketplace/job-template-remediation-validator
    - airesource:ai5-marketplace/job-template-creator
    - mcpserver:ai5-marketplace/ansible-automation-platform
  dependencyOf:
    - airesource:ai5-marketplace/remediation
