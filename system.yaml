apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: agentic-plugins
  title: Agentic Plugins
  description: >
    Agentic skill packs and MCP server configurations for Red Hat platforms.
    Provides AI-powered automation across OpenShift, Ansible, Virtualization,
    AI/ML, and SRE workflows through persona-specific skill modules.
  tags:
    - ai-skill
    - agentic
    - red-hat
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    github.com/project-slug: RHEcosystemAppEng/agentic-plugins

spec:
  owner: group:redhat/ai5-marketplace
  dependencyOf:
    - airesource:ocp-admin/ocp-admin
    - airesource:rh-sre/rh-sre
    - airesource:rh-virt/rh-virt
    - airesource:rh-developer/rh-developer
    - airesource:rh-basic/rh-basic
    - airesource:rh-ai-engineer/rh-ai-engineer
    - airesource:rh-automation/rh-automation
    - mcpserver:agentic-plugins/ai-observability
    - mcpserver:agentic-plugins/ansible-automation-platform
    - mcpserver:agentic-plugins/assisted-installer
    - mcpserver:agentic-plugins/github
    - mcpserver:agentic-plugins/openshift-mcp-server
    - mcpserver:agentic-plugins/podman
    - mcpserver:agentic-plugins/rhoai
