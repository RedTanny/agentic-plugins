apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: rh-automation
  namespace: rh-automation
  title: Automation
  description: >
    Automation governance for Ansible Automation Platform. Audit AAP
    configuration against Red Hat best practices, run governed execution
    with check mode and rollback, and perform forensic failure analysis.
  tags:
    - ai-skill
    - ansible
    - automation
    - governance
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: rh-automation
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    agentic.redhat.com/path: rh-automation
  links:
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins
      title: Source Repository
      icon: github
spec:
  type: plugin
  lifecycle: production
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  disciplines:
    - operations
  categories:
    - automation
    - governance
  agents:
    - claude-code
    - opencode
    - cursor
  dependsOn:
    - system:default/agentic-plugins
    - mcpserver:agentic-plugins/ansible-automation-platform
  dependencyOf:
    - airesource:rh-automation/aap-mcp-validator
    - airesource:rh-automation/execution-risk-analyzer
    - airesource:rh-automation/execution-summary
    - airesource:rh-automation/forensic-troubleshooter
    - airesource:rh-automation/governance-assessor
    - airesource:rh-automation/governance-executor
    - airesource:rh-automation/governance-readiness-assessor
    - airesource:rh-automation/governed-job-launcher
    - airesource:rh-automation/host-fact-inspector
    - airesource:rh-automation/job-failure-analyzer
    - airesource:rh-automation/resolution-advisor
