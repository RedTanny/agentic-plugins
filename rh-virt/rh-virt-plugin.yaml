apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: rh-virt
  namespace: ai5-marketplace
  title: Red Hat Virtualization
  description: >
    Automation capabilities for VM lifecycle management, provisioning,
    and inventory operations on OpenShift clusters using KubeVirt.
  tags:
    - ai-skill
    - virtualization
    - kubevirt
    - openshift
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: rh-virt
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    agentic.redhat.com/path: rh-virt
    github.com/project-slug: RHEcosystemAppEng/agentic-plugins
  links:
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins
      title: Source Repository
      icon: github
spec:
  type: plugin
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  disciplines:
    - platform-engineering
  categories:
    - virtualization
    - vm-lifecycle
  agents: []
  dependsOn:
    - mcpserver:ai5-marketplace/openshift-mcp-server
  dependencyOf:
    - airesource:ai5-marketplace/vm-clone
    - airesource:ai5-marketplace/vm-create
    - airesource:ai5-marketplace/vm-delete
    - airesource:ai5-marketplace/vm-inventory
    - airesource:ai5-marketplace/vm-lifecycle-manager
    - airesource:ai5-marketplace/vm-rebalance
    - airesource:ai5-marketplace/vm-snapshot-create
    - airesource:ai5-marketplace/vm-snapshot-delete
    - airesource:ai5-marketplace/vm-snapshot-list
    - airesource:ai5-marketplace/vm-snapshot-restore
