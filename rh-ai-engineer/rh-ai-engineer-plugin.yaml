apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: rh-ai-engineer
  namespace: rh-ai-engineer
  title: AI Engineering
  description: >
    Automation tools for AI/ML engineers working with Red Hat OpenShift AI.
    Deploy and manage models, pipelines, registries, workbenches, and
    serving runtimes on OpenShift AI.
  tags:
    - ai-skill
    - ai-engineering
    - openshift-ai
    - machine-learning
  annotations:
    agentic-plugins.redhat.com/version: "1.0"
    agentic-plugins.redhat.com/repo: "agentic-plugins"
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: rh-ai-engineer
    agentic.redhat.com/repository: https://github.com/RHEcosystemAppEng/agentic-plugins
    agentic.redhat.com/path: rh-ai-engineer
  links:
    - url: https://github.com/RHEcosystemAppEng/agentic-plugins
      title: Source Repository
      icon: github
spec:
  type: plugin
  lifecycle: production
  owner: group:redhat/ai5-marketplace
  system: default/agentic-plugins
  disciplines:
    - ai-engineering
  categories:
    - model-management
    - ml-ops
  agents:
    - claude-code
    - opencode
    - cursor
  dependsOn:
    - mcpserver:agentic-plugins/openshift-mcp-server
    - mcpserver:agentic-plugins/ai-observability
    - mcpserver:agentic-plugins/rhoai
  partOf:
    - system:default/agentic-plugins
  hasPart:
    - airesource:rh-ai-engineer/ai-observability
    - airesource:rh-ai-engineer/debug-inference
    - airesource:rh-ai-engineer/ds-project-setup
    - airesource:rh-ai-engineer/guardrails-config
    - airesource:rh-ai-engineer/model-deploy
    - airesource:rh-ai-engineer/model-monitor
    - airesource:rh-ai-engineer/model-registry
    - airesource:rh-ai-engineer/nim-setup
    - airesource:rh-ai-engineer/pipeline-manage
    - airesource:rh-ai-engineer/serving-runtime-config
    - airesource:rh-ai-engineer/workbench-manage
